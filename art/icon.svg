<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B101A"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- App squircle background -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Minimal viewfinder corners -->
  <g fill="none" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 84 V60 A8 8 0 0 1 60 52 H84"/>
    <path d="M172 52 H196 A8 8 0 0 1 204 60 V84"/>
    <path d="M52 172 V196 A8 8 0 0 0 60 204 H84"/>
    <path d="M172 204 H196 A8 8 0 0 0 204 196 V172"/>
  </g>

  <!-- Centered camera lens -->
  <circle cx="128" cy="128" r="46" fill="#0F172A" stroke="url(#lensGrad)" stroke-width="10"/>
  <circle cx="128" cy="128" r="22" fill="url(#lensGrad)"/>
  <circle cx="128" cy="128" r="10" fill="#0B101A"/>
  <circle cx="136" cy="120" r="5" fill="#F8FAFC"/>

  <!-- Subtle live/recording dot -->
  <circle cx="182" cy="74" r="9" fill="#EF4444"/>
</svg>
